# env.prod.example.yaml — Template for production Cloud Run deployment
# Copy to env.prod.yaml (which is gitignored) and fill in real production secrets.

APP_ENV: "production"
STORE_BACKEND: "memory"
FIRESTORE_DATABASE: ""
API_KEY: ""
OPENAI_API_KEY: ""
OPENAI_MODEL_FAST: "gpt-4o-mini"
OPENAI_MODEL_SMART: "gpt-4o"
GITHUB_TOKEN: ""
GITHUB_OWNER: ""
TARGET_REPO: "secureflow-demo-target"
TARGET_BASE_BRANCH: "main"
FRONTEND_ORIGIN: "https://your-frontend-service-run-url.a.run.app"
MAX_CONCURRENT_RUNS: "3"
MAX_TOTAL_RUNS: "100"
MAX_PATCH_CHANGED_LINES: "80"
SANDBOX_TIMEOUT_SECONDS: "60"
